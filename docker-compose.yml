services:
  attendance:
    build: .
    # Or, if you'd rather not build on the host, drop `build` and use a prebuilt image.
    pull_policy: build          # rebuild the image on redeploy instead of reusing the old one

    # Both of these must be unique per stack, so they're parameters. The defaults
    # are the production values, so an unmodified deploy behaves exactly as before.
    # To run a second copy (a test stack), set these in Portainer's environment
    # variables when deploying:
    #     APP_NAME=attendance_test
    #     HOST_PORT=8096
    # Each stack gets its own database - named volumes are prefixed with the
    # stack name, so the test copy can't touch your real attendance data.
    container_name: ${APP_NAME:-attendance}
    restart: unless-stopped
    # Hardening: no privilege escalation, no Linux capabilities (it listens on
    # 8080 and writes only to /data, so it needs none), and a tiny init as PID 1.
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HOST_PORT:-8095}:8080"    # direct LAN access; safe to remove once it's behind the proxy

    environment:
      TZ: Australia/Melbourne
      TZ_NAME: Australia/Melbourne   # used for "today" in the app
      DB_FILE: /data/attendance.db
    volumes:
      - attendance-data:/data        # SQLite lives here; back this up
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - nginxproxymanager

volumes:
  attendance-data:

networks:
  # Created and owned by the Nginx Proxy Manager stack, so join it rather than
  # declaring it here - without `external: true` Compose tries to own it too and
  # the proxy ends up on a different network, which reads as 502 Bad Gateway.
  # In the proxy host, forward to the container name above on port 8080.
  nginxproxymanager:
    external: true
    name: nginxproxymanager
